# Run the tests.
#
# Separate from the Pages workflow on purpose. This one runs on every branch and
# every pull request, so a change can be checked before it is anywhere near the
# published app; the deploy runs the same command again before it publishes, so
# a red build never reaches people.

name: Tests

on:
  push:
    branches: ['**']
    paths:
      - 'web/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        # A suite that passes against source it cannot bundle is not much of a
        # check, so the build is part of the test run rather than only part of
        # the deploy.
        run: npm run build
