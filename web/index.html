<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Before the first paint, and before React. An async read here would
      // paint the wrong theme and correct it a moment later.
      try {
        var t = localStorage.getItem('librapp-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        var c = localStorage.getItem('librapp-contrast')
        if (c === 'high' || c === 'normal') document.documentElement.setAttribute('data-contrast', c)
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <title>LibrAPP: your library catalog and your own personal librarian</title>
    <meta name="description" content="Build your full library catalog from a photograph of your shelf, then ask it about your own books. Works offline, installs as an app, and your books never leave your device." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LibrAPP" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
